<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="screen-orientation" content="landscape"><title>南湖物语：理工大恋爱事件簿</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{position:fixed;inset:0;width:100%;height:100%;height:100dvh;overscroll-behavior:none;touch-action:manipulation;background:#000;overflow:hidden;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color:#fff}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;overflow:hidden;background:#123}
#bg{position:absolute;inset:0;transition:background 1s}
#bgsvg{position:absolute;inset:0;width:100%;height:100%}
#place{position:absolute;left:24px;top:20px;background:rgba(0,0,0,.45);padding:8px 18px;border-left:5px solid #ffb347;font-size:22px;border-radius:4px}
#chars{position:absolute;inset:0;pointer-events:none}
.ch{position:absolute;bottom:-40px;height:700px;width:300px;transition:all .4s;display:flex;justify-content:center}
.ch img{height:100%;width:auto;filter:drop-shadow(0 6px 10px rgba(0,0,0,.35))}
.ch.dim{filter:brightness(.55)}
#box{position:absolute;left:40px;right:40px;bottom:20px;height:190px;background:linear-gradient(rgba(20,30,60,.88),rgba(10,15,35,.92));border:2px solid rgba(255,255,255,.35);border-radius:14px;padding:44px 34px 16px;font-size:27px;line-height:1.55;cursor:pointer}
#name{position:absolute;left:24px;top:-22px;background:#ff7aa2;padding:6px 22px;border-radius:10px;font-size:24px;font-weight:bold;box-shadow:0 3px 8px rgba(0,0,0,.4)}
#name:empty{display:none}
#next{position:absolute;right:20px;bottom:10px;animation:b 1s infinite}@keyframes b{50%{opacity:.2}}
#menu{position:absolute;right:46px;bottom:214px;display:flex;gap:8px}
.btn{background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 14px;border-radius:8px;font-size:18px;cursor:pointer}
.btn.on{background:#ff7aa2}
#choices{position:absolute;inset:0 0 210px;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:rgba(0,0,0,.25)}
.choice{width:640px;padding:18px;text-align:center;font-size:26px;background:rgba(255,255,255,.92);color:#333;border-radius:40px;cursor:pointer;border:3px solid #ff7aa2}
.choice:hover{background:#ffe0ea}
.panel{position:absolute;inset:0;background:rgba(5,10,25,.94);display:none;flex-direction:column;align-items:center;padding:40px;z-index:20}
.panel h2{font-size:34px;margin-bottom:20px;color:#ffb3c8}
#log{width:900px;flex:1;overflow-y:auto;font-size:22px;line-height:1.6;user-select:text}
#log b{color:#ffb3c8}
.slots{display:grid;grid-template-columns:repeat(3,320px);gap:16px}
.slot{background:#223;border:2px solid #557;border-radius:10px;padding:16px;font-size:19px;cursor:pointer;min-height:90px}
#title{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#ff9a8b,#ff6a88 40%,#3a3d8f);}
#title h1{font-size:76px;letter-spacing:6px;text-shadow:0 5px 0 #b03a5b,0 10px 20px rgba(0,0,0,.4)}
#title p{font-size:26px;margin:12px 0 40px}
#title .btn{font-size:28px;padding:12px 60px;margin:8px;width:320px;text-align:center}
#toast{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:#ff7aa2;padding:8px 24px;border-radius:20px;font-size:20px;display:none;z-index:50}
#aff{position:absolute;right:24px;top:20px;font-size:18px;background:rgba(0,0,0,.45);padding:6px 12px;border-radius:6px}
</style></head><body>
<div id="stage">
 <div id="bg"><svg id="bgsvg" viewBox="0 0 1280 720" preserveAspectRatio="none"></svg></div>
 <div id="place"></div><div id="aff"></div>
 <div id="chars"></div>
 <div id="choices"></div>
 <div id="menu"><span class="btn" data-a="auto">自动</span><span class="btn" data-a="skip">快进</span><span class="btn" data-a="log">回顾</span><span class="btn" data-a="save">存档</span><span class="btn" data-a="load">读档</span><span class="btn" data-a="cfg">设置</span><span class="btn" data-a="title">标题</span></div>
 <div id="box"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
 <div class="panel" id="logp"><h2>对话回顾</h2><div id="log"></div><span class="btn" onclick="hide('logp')">关闭</span></div>
 <div class="panel" id="slotp"><h2 id="slott">存档</h2><div class="slots" id="slots"></div><br><span class="btn" onclick="hide('slotp')">关闭</span></div>
 <div class="panel" id="cfgp"><h2>设置</h2><div style="font-size:24px;line-height:3">
  文字速度 <input type="range" id="spd" min="5" max="100" value="40"> <br>
  自动播放间隔 <input type="range" id="autod" min="500" max="4000" value="1600"> <br>
  主角名 <input id="pname" style="font-size:22px;width:200px" maxlength="6"></div><span class="btn" onclick="saveCfg()">确定</span></div>
 <div id="title"><h1>南湖物语</h1><p>～ 理工大南湖校区恋爱事件簿 ～</p>
  <span class="btn" onclick="newGame()">开始游戏</span><span class="btn" onclick="openSlots('load')">读取存档</span><span class="btn" onclick="show('cfgp')">设置</span>
  <p style="font-size:15px;margin-top:30px;opacity:.8">同人原型作品 · 人物与剧情纯属虚构 · 场景为插画风示意，非实景</p></div>
 <div id="toast"></div>
</div>

/* ===== 引擎 ===== */
const $=id=>document.getElementById(id);const LBL={};S.forEach((c,i)=>{if(c.label)LBL[c.label]=i});
let st={pc:0,aff:{xi:0,tang:0,ning:0,bro:0},bg:'black',show:[],name:''},cfg=JSON.parse(localStorage.getItem('nh_cfg')||'{"spd":40,"autod":1600,"pname":"吴文昊"}');
let typing=null,full='',auto=false,skip=false,log=[],busy=false,timer=null;
function fit(){const vv=window.visualViewport,W=vv?vv.width:innerWidth,H=vv?vv.height:innerHeight;const st=$('stage');st.style.top=(H/2)+'px';
 if(H>W){const s=Math.min(H/1280,W/720);st.style.transform=`translate(-50%,-50%) rotate(90deg) scale(${s})`}
 else{const s=Math.min(W/1280,H/720);st.style.transform=`translate(-50%,-50%) scale(${s})`}}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));if(window.visualViewport)visualViewport.addEventListener('resize',fit);fit();
document.addEventListener('touchmove',e=>{if(e.target.type!=='range'&&!e.target.closest('#log'))e.preventDefault()},{passive:false});
let triedLock=false;document.addEventListener('pointerdown',async()=>{if(triedLock)return;triedLock=true;try{const el=document.documentElement;if(el.requestFullscreen&&innerHeight>innerWidth&&/Android/i.test(navigator.userAgent)&&!/MicroMessenger/i.test(navigator.userAgent)){await el.requestFullscreen({navigationUI:'hide'});await screen.orientation.lock('landscape')}}catch(e){}finally{setTimeout(fit,300)}},{once:false});
function setBg(k){st.bg=k;const b=BG[k];$('bg').style.background=`linear-gradient(${b.sky[0]},${b.sky[1]})`;$('bgsvg').innerHTML=b.draw;$('place').textContent=b.n;$('place').style.display=b.n?'':'none'}
function setShow(a,speaker){st.show=a;$('chars').innerHTML=a.map(([id,x])=>`<div class="ch ${speaker&&speaker!==id?'dim':''}" style="left:${x}px">${CH[id].svg}</div>`).join('')}
function P(t){return t.replace(/\{P\}/g,cfg.pname||'吴文昊')}
function updAff(){const a=st.aff;$('aff').textContent=`💗 晓汐${a.xi} · 糖${a.tang} · 柠${a.ning}`}
function step(){clearTimeout(timer);while(true){const c=S[st.pc];if(!c)return;
 if(c.bg){setBg(c.bg);st.pc++;continue}
 if(c.show){setShow(c.show);st.pc++;continue}
 if(c.label){st.pc++;continue}
 if(c.jump){st.pc=LBL[c.jump];continue}
 if(c.ifEnd){const a=st.aff,m=Math.max(a.xi,a.tang,a.ning);let e='end_normal';if(a.bro>=5)e='end_bro';else if(m>=4)e=a.xi===m?'end_xi':a.tang===m?'end_tang':'end_ning';st.pc=LBL[e];continue}
 if(c.title){toTitle();return}
 if(c.choice){showChoice(c.choice);return}
 if(c.say){say(c.say);st.pc++;return}}}
function say([who,t]){t=P(t);const nm=who==='me'?(cfg.pname||'吴文昊'):who?CH[who].n:'';$('name').textContent=nm;setShow(st.show,who&&who!=='me'?who:null);log.push([nm,t]);if(log.length>200)log.shift();full=t;let i=0;$('text').textContent='';clearInterval(typing);
 const sp=skip?0:Math.max(5,105-cfg.spd);if(!sp){$('text').textContent=t;typing=null;afterType();return}
 typing=setInterval(()=>{i++;$('text').textContent=t.slice(0,i);if(i>=t.length){clearInterval(typing);typing=null;afterType()}},sp)}
function afterType(){if(skip)timer=setTimeout(step,60);else if(auto)timer=setTimeout(step,cfg.autod)}
function advance(){if($('choices').style.display==='flex')return;if(typing){clearInterval(typing);typing=null;$('text').textContent=full;afterType();return}step()}
function showChoice(opts){skip=false;mark();const d=$('choices');d.innerHTML='';opts.forEach(([t,eff,go])=>{const e=document.createElement('div');e.className='choice';e.textContent=P(t);e.onclick=ev=>{ev.stopPropagation();for(const k in eff)st.aff[k]=(st.aff[k]||0)+eff[k];updAff();log.push(['▶ 选择',t]);d.style.display='none';st.pc=LBL[go];step()};d.appendChild(e)});d.style.display='flex'}
$('box').onclick=advance;$('chars').onclick=advance;
addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')advance()});
function mark(){document.querySelectorAll('#menu .btn').forEach(b=>b.classList.toggle('on',(b.dataset.a==='auto'&&auto)||(b.dataset.a==='skip'&&skip)))}
$('menu').onclick=e=>{const a=e.target.dataset.a;if(!a)return;e.stopPropagation();
 if(a==='auto'){auto=!auto;skip=false;mark();if(auto&&!typing)step()}
 if(a==='skip'){skip=!skip;auto=false;mark();if(skip&&!typing)step()}
 if(a==='log'){$('log').innerHTML=log.map(([n,t])=>`<p>${n?`<b>${n}</b>：`:''}${t}</p>`).join('');show('logp');$('log').scrollTop=1e9}
 if(a==='save')openSlots('save');if(a==='load')openSlots('load');if(a==='cfg')show('cfgp');if(a==='title')toTitle()};
function show(id){if(id==='cfgp'){$('spd').value=cfg.spd;$('autod').value=cfg.autod;$('pname').value=cfg.pname}$(id).style.display='flex';auto=skip=false;mark()}
function hide(id){$(id).style.display='none'}
function saveCfg(){cfg={spd:+$('spd').value,autod:+$('autod').value,pname:$('pname').value.trim()||'吴文昊'};localStorage.setItem('nh_cfg',JSON.stringify(cfg));hide('cfgp')}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1500)}
function openSlots(mode){$('slott').textContent=mode==='save'?'存档':'读档';const box=$('slots');box.innerHTML='';
 for(let i=1;i<=6;i++){const d=JSON.parse(localStorage.getItem('nh_slot'+i)||'null');const e=document.createElement('div');e.className='slot';
  e.innerHTML=d?`<b>存档 ${i}</b><br>${d.time}<br>${BG[d.st.bg].n||''}`:`存档 ${i}<br>（空）`;
  e.onclick=()=>{if(mode==='save'){const s={...st,pc:Math.max(0,st.pc-1)};localStorage.setItem('nh_slot'+i,JSON.stringify({st:s,time:new Date().toLocaleString('zh-CN')}));toast('已保存');openSlots('save')}
   else if(d){st=d.st;hide('slotp');$('title').style.display='none';$('choices').style.display='none';log=[];setBg(st.bg);setShow(st.show);updAff();step();toast('已读取')}};box.appendChild(e)}
 show('slotp')}
function newGame(){st={pc:0,aff:{xi:0,tang:0,ning:0,bro:0},bg:'black',show:[]};log=[];$('title').style.display='none';updAff();step()}
function toTitle(){auto=skip=false;mark();clearTimeout(timer);$('choices').style.display='none';$('title').style.display='flex'}
