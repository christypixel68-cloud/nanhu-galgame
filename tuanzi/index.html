function openPerk(){const pool=PK.filter(p=>(P.pk[p.id]||0)<p.m&&(!p.cond||p.cond(P)));
// weight synergy completers up
pool.sort(()=>R()-.5);const pick=[];const syn=pool.find(p=>SYN.some(s=>!P.syn[s.id]&&((s.a==p.id&&P.pk[s.b])||(s.b==p.id&&P.pk[s.a]))));if(syn&&R()<.7)pick.push(syn);
for(const p of pool){if(pick.length>=3)break;if(!pick.includes(p))pick.push(p);}perkOpts=pick;scene='perk';}
function takePerk(p){p.f(P);P.pk[p.id]=(P.pk[p.id]||0)+1;for(const s of SYN)if(!P.syn[s.id]&&P.pk[s.a]&&P.pk[s.b]){P.syn[s.id]=1;newSyn=s;banner={a:'激活羁绊',b:s.n+'：'+s.d,t:2.4,col:'#c77dff'};sfx.syn();}
P.inv=Math.max(P.inv,.8);ring(P.x,P.y-32,p.c,90,.4);scene='play';}
function synOf(p){return SYN.find(s=>!P.syn[s.id]&&((s.a==p.id&&P.pk[s.b])||(s.b==p.id&&P.pk[s.a])))}

function rr(x,y,w,h,r){g.beginPath();g.roundRect(x,y,w,h,r);}
function txt(s,x,y,sz,col='#fff',al='center',st=OL,lw){g.font=`900 ${sz}px "PingFang SC","Microsoft YaHei","Noto Sans CJK SC","Noto Serif CJK SC",sans-serif`;g.textAlign=al;g.textBaseline='middle';
if(st){g.lineWidth=lw||Math.max(3,sz/5);g.strokeStyle=st;g.lineJoin='round';g.strokeText(s,x,y);}g.fillStyle=col;g.fillText(s,x,y);}
function eyes(x,y,sp,sz,mood,look=-1.5){if(mood=='x'){g.strokeStyle=OL;g.lineWidth=3;for(const s of[-1,1]){g.beginPath();g.moveTo(x+s*sp-5,y-5);g.lineTo(x+s*sp+5,y+5);g.moveTo(x+s*sp+5,y-5);g.lineTo(x+s*sp-5,y+5);g.stroke();}return;}
if(mood=='^'){g.strokeStyle=OL;g.lineWidth=3;for(const s of[-1,1]){g.beginPath();g.arc(x+s*sp,y+2,sz*.8,Math.PI*1.15,Math.PI*1.85);g.stroke();}return;}
for(const s of[-1,1]){E(x+s*sp,y,sz,sz*1.1,'#fff',OL,2);E(x+s*sp+look,y+1,sz*.55,sz*.65,'#2a1a3a');E(x+s*sp+look+1,y-2,sz*.22,sz*.22,'#fff');}
if(mood=='angry'){g.strokeStyle=OL;g.lineWidth=3.5;g.beginPath();g.moveTo(x-sp-sz,y-sz-6);g.lineTo(x-sp+sz,y-sz-1);g.moveTo(x+sp+sz,y-sz-6);g.lineTo(x+sp-sz,y-sz-1);g.stroke();}}
